global:
  scrape_interval: 10s  
  evaluation_interval: 10s 

rule_files:
  - '/etc/prometheus/alert.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - demo_alertmanager:9093

scrape_configs:
  # Monitor itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['demo_prometheus:9090']

  # Get metrics from alloy
  # Alloy: Node-exporter, MySQL-exporter, Nginx-exporter
  - job_name: 'alloy-telemetry'
    static_configs:
      - targets: ['demo_alloy:12345']

