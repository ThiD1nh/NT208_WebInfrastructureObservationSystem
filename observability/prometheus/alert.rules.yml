groups:
  - name: backend_performance_alerts
    rules:
      - alert: BackendHighLatency
        expr: (sum(rate(fastapi_requests_duration_seconds_sum[5m])) / sum(rate(fastapi_requests_duration_seconds_count[5m]))) > 0.5
        for: 30s
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "High Latency on {{ $labels.instance }}"
          description: "Average request latency is {{ $value | printf \"%.2f\" }}s (threshold: 0.5s)."

      - alert: BackendServerErrors
        expr: sum(rate(fastapi_responses_total{status_code=~"5.."}[1m])) > 0.5
        for: 30s
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "High 5xx Error Rate on {{ $labels.instance }}"
          description: "Backend is returning 5xx errors at a rate of {{ $value }} req/sec."

  - name: performance_alerts
    rules:
      - alert: HostHighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 2m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: "CPU usage is at {{ $value | printf \"%.2f\" }}% (threshold: 80%)."
