
groups:
  - name: performance_alerts
    rules:
      # --- ALERT 1: HIGH CPU USAGE  ---
      # Description: Fires if CPU usage is above 80% for 2 minutes.
      - alert: HostHighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 2m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: "CPU usage is at {{ $value | printf \"%.2f\" }}% (threshold: 80%)."

      # --- ALERT 2: HIGH REQUEST LATENCY  ---
      # Description: Fires if average Nginx latency is above 0.5s for 1 minute.
      - alert: NginxHighLatency
        expr: (sum(rate(nginx_http_request_duration_seconds_sum[5m])) / sum(rate(nginx_http_request_duration_seconds_count[5m]))) > 0.5
        for: 1m
        labels:
          severity: warning
          service: nginx
        annotations:
          summary: "High latency detected on Nginx"
          description: "Current average latency is {{ $value | printf \"%.2f\" }}s (threshold: 0.5s)."