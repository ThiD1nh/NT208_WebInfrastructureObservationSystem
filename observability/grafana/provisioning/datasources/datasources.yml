apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    orgId: 1
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    # Change method for better query
    jsonData:
      httpMethod: POST

  - name: Loki
    type: loki
    orgId: 1
    uid: loki
    url: http://loki:3100
    access: proxy
    # Logs to Traces
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"trace_id": "(\w+)"'
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    orgId: 1
    uid: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      # Vẽ sơ đồ đường dẫn request, trực quan hóa traces
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki 
      # Trace-to-Logs
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        tags: ['job', 'instance', 'pod', 'namespace']