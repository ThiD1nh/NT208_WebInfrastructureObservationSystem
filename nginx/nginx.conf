events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_access escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"remote_addr":"$remote_addr",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log json_access;
        error_log  /var/log/nginx/error.log warn;

        # Serve static frontend files mounted from ./frontend.
        # Browser GET /        -> /usr/share/nginx/html/index.html
        # Browser GET /app.js  -> /usr/share/nginx/html/app.js
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Frontend API calls under /api/* go to FastAPI backend.
        # Examples:
        # GET /api/fast  -> backend-app:8000/api/fast
        # GET /api/slow  -> backend-app:8000/api/slow
        # GET /api/error -> backend-app:8000/api/error
        location /api/ {
            proxy_pass         http://backend-app:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check API used by frontend status pill and curl checks.
        # GET /health -> backend-app:8000/health
        location = /health {
            proxy_pass         http://backend-app:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # Server block riêng cho Alloy nginx exporter
    server {
        listen 8080;
        server_name _;

        access_log off;

        location /stub_status {
            stub_status on;
        }
    }
}
