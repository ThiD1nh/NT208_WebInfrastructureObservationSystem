version: '3.8'

networks: 
  observability_net:
    driver: bridge

volumes:
  mysql_data:

services:
  database:
    image: mysql:8.0
    container_name: demo_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword 
      - MYSQL_DATABASE=shop_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
    volumes:
      - mysql_data:var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - observability_net

  backend-app:
    build: 
      context: ./target-app
    container_name: demo_backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=database 
      - DB_USER=app_user
      - DB_PASSWORD=app_password
    volumes:
      - ./target-app/logs:/app/logs 
    depends_on:
      - database 
    networks:
      - observability_net

  nginx: 
    image: nginx:alpine
    container_name: demo_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf: /etc/nginx/nginx.conf:ro
      - ./nginx/logs: /var/log/nginx
    depends_on:
      - backend-app
    networks:
      - observability_net

  alloy:
    image: grafana/alloy:latest
    container_name: demo_alloy
    ports:
      - "4317:4317" # Port gRPC 
      - "4318:4318" # Port HTTP 
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy 
      - ./target-app/logs:/var/log/app 
      - ./nginx/logs:/var/log/nginx 
    command: 
      - run
      - /etc/alloy/config.alloy 
    depends_on:
      - nginx
    networks:
      - observability_net