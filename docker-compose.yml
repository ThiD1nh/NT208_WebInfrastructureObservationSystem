
networks: 
  observability_net:
    driver: bridge

volumes:
  mysql_data: # Named volume
  prom_data:     
  loki_data:     
  tempo_data:    
  grafana_data:

services:
  database:
    image: mysql:8.0
    container_name: demo_mysql
    environment:  # Cac thiet lap ban dau
      - MYSQL_ROOT_PASSWORD=rootpassword  # Tao mat khau cho root
      - MYSQL_DATABASE=shop_db  # Tao database rong shop_db de bom init.sql
      - MYSQL_USER=app_user # Tao user trong app
      - MYSQL_PASSWORD=app_password
    volumes:
      - mysql_data:/var/lib/mysql # Named volume
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql  # Bind mount
    networks:
      - observability_net

  backend-app:
    build: 
      context: ./target-app
    container_name: demo_backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=database  # Su dung host la database duoc khai bao o tren
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - OTLP_ENDPOINT=alloy:4317
    volumes:
      - ./target-app/logs:/app/logs 
    depends_on:
      - database 
    networks:
      - observability_net

  nginx: 
    image: nginx:alpine
    container_name: demo_nginx
    ports:
      - "8081:80"
      - "8080:8080" # stub_status
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./frontend:/usr/share/nginx/html:ro 
    depends_on:
      - backend-app
    networks:
      - observability_net

  alloy:
    image: grafana/alloy:latest
    container_name: demo_alloy
    ports:
      - "4317:4317" # Port gRPC 
      - "4318:4318" # Port HTTP 
      - "12345:12345" # Port UI Alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./target-app/logs:/var/log/app:ro
      - ./nginx/logs:/var/log/nginx:ro
    command: 
      - run
      - /etc/alloy/config.alloy 
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - nginx
      - prometheus
      - loki
      - tempo
    networks:
      - observability_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: demo_nginx_exporter
    command:
      - '-nginx.scrape-uri=http://nginx:8080/stub_status'
    depends_on:
      - nginx
    networks:
      - observability_net
    

  prometheus:
    image:  prom/prometheus:latest
    container_name: demo_prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro 
      - ./observability/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prom_data:/prometheus 
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver' # Thay vì pull thì Alloy push, Alloy trở thành trung tâm điều phối
    networks:
      - observability_net 

  loki:
    image:  grafana/loki:latest
    container_name: demo_loki
    user: "root"
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command:  -config.file=/etc/loki/local-config.yaml
    networks:
      - observability_net 

  tempo:
    image: grafana/tempo:2.8.0
    container_name: demo_tempo
    user: "root"
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    command:  [ "-config.file=/etc/tempo.yaml" ]
    networks:
      - observability_net 

  grafana:
    image:  grafana/grafana:latest
    container_name: demo_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability_net 

  alertmanager:
    image: prom/alertmanager:latest
    container_name: demo_alertmanager
    ports:
      - "19093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - observability_net
    restart: always
  telegram-webhook:

    build: 
      context: ./custom-plugins/telegram-webhook
      dockerfile: Dockerfile
    container_name: demo_telegram_webhook
    ports:
      - "9000:9000"
    env_file:
      - ./custom-plugins/telegram-webhook/.env
    networks:
      - observability_net
    restart: always

